<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SentinelScope</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loginScreen">
  <div id="loginBox">
    <div class="brand">🛡️ SENTINELSCOPE</div>
    <input id="loginEmail" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Contraseña">
    <button onclick="login()">Ingresar</button>
    <div id="loginError"></div>
  </div>
</div>

<div id="app" class="hidden">
  <aside id="sidebar">
    <div>
      <div class="brand-row">🛡️ SENTINELSCOPE</div>
      <nav class="sidenav" id="sidenav"></nav>
    </div>
    <div class="sidebar-footer">
      <div class="user-row">
        <div class="avatar" id="userAvatar">?</div>
        <div class="user-meta">
          <div class="name" id="userName">—</div>
          <span class="role-badge" id="userRole">—</span>
        </div>
      </div>
      <a href="#" class="logout-link" onclick="logout();return false;">⏻ Cerrar sesión</a>
    </div>
  </aside>

  <main id="main">
    <div id="pageContent"></div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toastStack"></div>

<script src="app.js"></script>
</body>
</html>
